name: Build & Push SLAM Docker Image

on:
  push:
    paths:
      - 'RPW_vislam/docker/Dockerfile.slam'
  pull_request:
    paths:
      - 'RPW_vislam/docker/Dockerfile.slam'
  workflow_dispatch:

jobs:
  build-slam:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build & push slam image
      - name: Build & push slam image (ARM64)
        run: |
          echo "Building slam image for ARM64..."
          docker buildx build \
            --platform linux/arm64 \
            -f RPW_vislam/docker/Dockerfile.slam \
            -t silviis/rpw-vislam-slam:latest \
            --push .

