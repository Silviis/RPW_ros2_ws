name: Build & Push Docker Images (ARM64)

on:
  push:
    paths:
      - 'Dockerfile.camera'
      - 'Dockerfile.slam'
  pull_request:
    paths:
      - 'Dockerfile.camera'
      - 'Dockerfile.slam'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      camera-changed: ${{ steps.filter.outputs.camera }}
      slam-changed: ${{ steps.filter.outputs.slam }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Detect changed Dockerfiles
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            camera:
              - 'Dockerfile.camera'
            slam:
              - 'Dockerfile.slam'

  build:
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push camera image (ARM64)
        if: ${{ needs.detect-changes.outputs.camera-changed == 'true' }}
        run: |
          echo "Building camera image for ARM64..."
          docker buildx build \
            --platform linux/arm64 \
            -f Dockerfile.camera \
            -t silviis/rpw-vislam-camera:latest \
            --push .

      - name: Build & push slam image (ARM64)
        if: ${{ needs.detect-changes.outputs.slam-changed == 'true' }}
        run: |
          echo "Building slam image for ARM64..."
          docker buildx build \
            --platform linux/arm64 \
            -f Dockerfile.slam \
            -t silviis/rpw-vislam-slam:latest \
            --push .
